name: Build MayatSilicon

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to build"
        required: true
        default: "main"
        type: string

      config:
        description: "Kernel config fragment (kosongkan / 'none' untuk skip)"
        required: false
        default: "tissot.config"
        type: string

      kernelname:
        description: "Kernel defconfig name"
        required: true
        default: "msm8953-perf"
        type: string

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      TZ: Asia/Jakarta
      CONFIG: ${{ inputs.config }}
      KERNELNAME: ${{ inputs.kernelname }}

    steps:
      # ========================================
      # CHECKOUT
      # ========================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0

      # ========================================
      # DEPENDENCIES
      # ========================================
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison flex libssl-dev build-essential \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi gcc-arm-linux-gnueabihf \
            python3 aria2 cpio zip unzip git curl wget \
            libelf-dev dwarves lz4 zstd rsync

      # ========================================
      # BAKASU (optional, non-fatal)
      # ========================================
      - name: Setup BakaSU (optional)
        continue-on-error: true
        run: |
          curl -LSs \
            https://raw.githubusercontent.com/Baka-SU/BakaSU/main/kernel/setup.sh \
            | bash || echo "WARNING: BakaSU setup failed, continuing..."

      # ========================================
      # KERNELSU MANUAL HOOKS (optional)
      # ========================================
      - name: Apply KernelSU manual hooks (optional)
        continue-on-error: true
        run: |
          if [ -f ksu_manual_hook_patch.py ]; then
            python3 ksu_manual_hook_patch.py . || echo "WARNING: hook patch failed"
          else
            echo "WARNING: ksu_manual_hook_patch.py not found — skipping"
          fi

      # ========================================
      # CLANG 20
      # ========================================
      - name: Download AOSP Clang 20
        run: |
          set -e
          CLANG_DIR="prebuilts/clang/host/linux-x86/clang-r547379"
          mkdir -p "$CLANG_DIR"
          aria2c -x 16 -s 16 -k 1M \
            https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r547379.tar.gz \
            -o clang-r547379.tar.gz
          tar -xzf clang-r547379.tar.gz -C "$CLANG_DIR"
          chmod +x "$CLANG_DIR/bin/"*
          rm -f clang-r547379.tar.gz

      # ========================================
      # ENVIRONMENT
      # ========================================
      - name: Export build environment
        run: |
          echo "KERNEL_DIR=$PWD" >> "$GITHUB_ENV"
          echo "CLANG_PATH=$PWD/prebuilts/clang/host/linux-x86/clang-r547379/bin" >> "$GITHUB_ENV"
          echo "PATH=$PWD/prebuilts/clang/host/linux-x86/clang-r547379/bin:$PATH" >> "$GITHUB_ENV"

      # ========================================
      # BUILD KERNEL (AUTO-DETECT + FALLBACK)
      # ========================================
      - name: Build kernel
        run: |
          set -e

          export ARCH=arm64
          export SUBARCH=arm64
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm \
                 OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip
          export LLVM=1 LLVM_IAS=1
          export KBUILD_BUILD_USER=Reiame KBUILD_BUILD_HOST=Mika

          mkdir -p out

          echo "========================================"
          echo "MayatSilicon Kernel Build"
          echo "========================================"
          echo "Branch : ${{ inputs.branch }}"
          echo "Kernel : ${KERNELNAME}"
          echo "Config : ${CONFIG:-<none>}"
          echo "========================================"

          # ----------------------------------------
          # 1) FIND DEFCONFIG (auto-detect)
          # ----------------------------------------
          DEFCONFIG="${KERNELNAME}_defconfig"
          echo "Searching for ${DEFCONFIG}..."

          DEFCONFIG_PATH=$(find arch/arm64/configs \
            -type f -name "${DEFCONFIG}" -print -quit 2>/dev/null || true)

          # fallback: try without _defconfig suffix
          if [ -z "$DEFCONFIG_PATH" ]; then
            echo "WARN: ${DEFCONFIG} not found, trying ${KERNELNAME}.config ..."
            DEFCONFIG_PATH=$(find arch/arm64/configs \
              -type f -name "${KERNELNAME}.config" -print -quit 2>/dev/null || true)
          fi

          if [ -z "$DEFCONFIG_PATH" ]; then
            echo "ERROR: no defconfig found for ${KERNELNAME}"
            echo "Available defconfigs:"
            ls arch/arm64/configs/ || true
            exit 1
          fi

          echo "Defconfig found: $DEFCONFIG_PATH"

          # derive target (strip arch/arm64/configs/ prefix + .defconfig/.config)
          DEFCONFIG_TARGET="${DEFCONFIG_PATH#arch/arm64/configs/}"
          DEFCONFIG_TARGET="${DEFCONFIG_TARGET%.defconfig}"
          DEFCONFIG_TARGET="${DEFCONFIG_TARGET%.config}"
          echo "Defconfig target: $DEFCONFIG_TARGET"

          # ----------------------------------------
          # 2) APPLY DEFCONFIG
          # ----------------------------------------
          make O=out "$DEFCONFIG_TARGET"

          # ----------------------------------------
          # 3) FIND CONFIG FRAGMENT (auto / graceful skip)
          # ----------------------------------------
          CONFIG_FILE="${CONFIG:-}"

          if [ -z "$CONFIG_FILE" ] || [ "$CONFIG_FILE" = "none" ] || [ "$CONFIG_FILE" = "None" ]; then
            echo "No config fragment requested — skipping merge."
          else
            echo "Searching for fragment '${CONFIG_FILE}'..."

            CONFIG_PATH=$(find arch/arm64/configs \
              -type f -name "${CONFIG_FILE}" -print -quit 2>/dev/null || true)

            # fallback: case-insensitive + search whole tree
            if [ -z "$CONFIG_PATH" ]; then
              echo "WARN: not in arch/arm64/configs, searching whole tree..."
              CONFIG_PATH=$(find . -type f -iname "${CONFIG_FILE}" \
                -not -path "./out/*" -not -path "./.git/*" \
                -print -quit 2>/dev/null || true)
            fi

            # fallback: pattern search tissot*
            if [ -z "$CONFIG_PATH" ]; then
              echo "WARN: exact not found, trying pattern '*tissot*config*'..."
              CONFIG_PATH=$(find arch/arm64/configs -type f \
                -iname '*tissot*' -print -quit 2>/dev/null || true)
            fi

            if [ -z "$CONFIG_PATH" ]; then
              echo "WARNING: fragment '${CONFIG_FILE}' not found anywhere."
              echo "         Continuing WITHOUT fragment merge."
              echo "         (build will use defconfig only)"
            else
              echo "Fragment found: $CONFIG_PATH"
              scripts/kconfig/merge_config.sh -O out out/.config "$CONFIG_PATH"
            fi
          fi

          # ----------------------------------------
          # 4) FINALIZE CONFIG
          # ----------------------------------------
          make O=out olddefconfig

          # ----------------------------------------
          # 5) BUILD
          # ----------------------------------------
          make -j"$(nproc --all)" O=out \
            ARCH=arm64 SUBARCH=arm64 \
            CC=clang LLVM=1 LLVM_IAS=1

          # ----------------------------------------
          # 6) KERNEL VERSION
          # ----------------------------------------
          KERNEL_VERSION=$(make kernelversion)
          echo "KERNEL_VERSION=$KERNEL_VERSION" >> "$GITHUB_ENV"
          echo "========================================"
          echo "Build completed: $KERNEL_VERSION"
          echo "========================================"

      # ========================================
      # VERIFY OUTPUT
      # ========================================
      - name: Verify kernel output
        run: |
          set -e
          echo "Kernel output:"
          ls -lh out/arch/arm64/boot/ || true

          FOUND=0
          for f in Image.gz Image.gz-dtb Image Image.lz4 Image.lz4-dtb; do
            if [ -f "out/arch/arm64/boot/$f" ]; then
              echo "FOUND: $f"
              FOUND=1
            fi
          done

          if [ "$FOUND" -eq 0 ]; then
            echo "ERROR: no kernel image found!"
            exit 1
          fi

      # ========================================
      # ANYKERNEL3 (auto-fallback repo/branch)
      # ========================================
      - name: Clone AnyKernel3 (with fallback)
        run: |
          set -e
          if git clone https://github.com/rahmatsobrian/AnyKernel3.git -b tissot AnyKernel 2>/dev/null; then
            echo "Cloned rahmatsobrian/AnyKernel3 (tissot)"
          else
            echo "WARN: tissot branch failed, cloning default branch..."
            rm -rf AnyKernel
            git clone https://github.com/rahmatsobrian/AnyKernel3.git AnyKernel
          fi

      # ========================================
      # PACKAGE (auto-detect image type)
      # ========================================
      - name: Package kernel image
        run: |
          set -e
          DATE=$(date +%Y%m%d)
          BOOT=out/arch/arm64/boot

          PICKED=""
          if [ -f "$BOOT/Image.gz-dtb" ]; then
            PICKED="Image.gz-dtb"
          elif [ -f "$BOOT/Image.gz" ]; then
            PICKED="Image.gz"
          elif [ -f "$BOOT/Image" ]; then
            PICKED="Image"
          elif [ -f "$BOOT/Image.lz4" ]; then
            PICKED="Image.lz4"
          fi

          if [ -z "$PICKED" ]; then
            echo "ERROR: no image to package"
            exit 1
          fi

          echo "Packaging: $PICKED"

          rm -f AnyKernel/Image.gz AnyKernel/Image.gz-dtb AnyKernel/Image AnyKernel/Image.lz4
          cp "$BOOT/$PICKED" "AnyKernel/$PICKED"

          cd AnyKernel
          zip -r9 "../MayatSilicon-${KERNELNAME}-${PICKED}-${DATE}.zip" . -x ".git/*"
          echo "ZIP_NAME=MayatSilicon-${KERNELNAME}-${PICKED}-${DATE}.zip" >> "$GITHUB_ENV"

      # ========================================
      # UPLOAD ARTIFACTS
      # ========================================
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MayatSilicon-${{ inputs.kernelname }}-${{ inputs.branch }}
          path: MayatSilicon-${{ inputs.kernelname }}-*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
