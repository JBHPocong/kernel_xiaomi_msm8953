name: Build Kernel

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to build"
        required: true
        default: "main"
        type: string

      config:
        description: "Kernel config fragment"
        required: true
        default: "tissot.config"
        type: string

      kernelname:
        description: "Kernel name"
        required: true
        default: "msm8953-perf"
        type: string

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      TZ: Asia/Jakarta
      CONFIG: ${{ inputs.config }}
      KERNELNAME: ${{ inputs.kernelname }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison flex libssl-dev build-essential \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            gcc-arm-linux-gnueabihf python3 aria2 cpio \
            zip unzip git curl wget

      - name: Setup BakaSU
        run: |
          curl -LSs https://raw.githubusercontent.com/Baka-SU/BakaSU/main/kernel/setup.sh | bash

      - name: Apply KernelSU manual hooks
        run: |
          python3 ksu_manual_hook_patch.py .

      - name: Clone AOSP Clang 20
        run: |
          mkdir -p prebuilts/clang/host/linux-x86/clang-r547379

          aria2c -x 16 -s 16 -k 1M \
            https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r547379.tar.gz

          tar -xzf clang-r547379.tar.gz \
            -C prebuilts/clang/host/linux-x86/clang-r547379

      - name: Export build environment
        run: |
          echo "KERNEL_DIR=$PWD" >> "$GITHUB_ENV"
          echo "CLANG_PATH=$PWD/prebuilts/clang/host/linux-x86/clang-r547379/bin" >> "$GITHUB_ENV"
          echo "PATH=$PWD/prebuilts/clang/host/linux-x86/clang-r547379/bin:$PATH" >> "$GITHUB_ENV"

      - name: Build kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64

          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-

          export CC=clang
          export LD=ld.lld
          export AR=llvm-ar
          export NM=llvm-nm
          export OBJCOPY=llvm-objcopy
          export OBJDUMP=llvm-objdump
          export STRIP=llvm-strip

          export LLVM=1
          export LLVM_IAS=1

          export KBUILD_BUILD_USER=Reiame
          export KBUILD_BUILD_HOST=Mika

          mkdir -p out

          echo "Building branch: ${{ inputs.branch }}"
          echo "Config: ${CONFIG}"
          echo "Kernel: ${KERNELNAME}"

          make O=out "${KERNELNAME}_defconfig"

          if [ -f "vendor/xiaomi/${CONFIG}" ]; then
            scripts/kconfig/merge_config.sh \
              -O out \
              out/.config \
              "vendor/xiaomi/${CONFIG}"

            make O=out olddefconfig
          elif [ -f "${CONFIG}" ]; then
            scripts/kconfig/merge_config.sh \
              -O out \
              out/.config \
              "${CONFIG}"

            make O=out olddefconfig
          else
            echo "ERROR: Config fragment not found: ${CONFIG}"
            exit 1
          fi

          make -j"$(nproc --all)" O=out \
            ARCH=arm64 \
            SUBARCH=arm64 \
            CC=clang \
            LLVM=1 \
            LLVM_IAS=1

      - name: Verify kernel output
        run: |
          ls -lh out/arch/arm64/boot/

          test -f out/arch/arm64/boot/Image.gz

          if [ -f out/arch/arm64/boot/Image.gz-dtb ]; then
            echo "Image.gz-dtb found"
          else
            echo "Image.gz-dtb not found"
          fi

      - name: Clone AnyKernel3
        run: |
          git clone \
            https://github.com/rahmatsobrian/AnyKernel3.git \
            -b tissot AnyKernel

      - name: Package Image.gz
        run: |
          cp out/arch/arm64/boot/Image.gz AnyKernel/

          cd AnyKernel

          zip -r9 ../test1-${KERNELNAME}-$(date +%Y%m%d).zip . \
            -x ".git/*"

      - name: Package Image.gz-dtb
        run: |
          if [ ! -f out/arch/arm64/boot/Image.gz-dtb ]; then
            echo "Image.gz-dtb unavailable, skipping"
            exit 0
          fi

          rm -f AnyKernel/Image.gz

          cp out/arch/arm64/boot/Image.gz-dtb AnyKernel/

          cd AnyKernel

          zip -r9 ../test2-${KERNELNAME}-$(date +%Y%m%d).zip . \
            -x ".git/*"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-${{ inputs.kernelname }}-${{ inputs.branch }}
          path: |
            test1-${{ inputs.kernelname }}-*.zip
            test2-${{ inputs.kernelname }}-*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
